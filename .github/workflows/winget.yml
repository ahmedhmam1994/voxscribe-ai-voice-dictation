name: Submit to winget

# Opens the winget-pkgs pull request for a new Windows release, so winget never
# falls behind. Uses Microsoft's own wingetcreate (no third-party action holds
# the token), and only needs one repository secret:
#
#   WINGET_TOKEN = a classic personal access token with the public_repo scope,
#   from an account that owns a fork of microsoft/winget-pkgs.
#
# Android releases (tags starting with android-v) and prereleases are skipped.
# Releases here are published by hand and the installer is attached afterwards,
# so the job waits for VoxScribe-Setup.exe to appear before it submits. It can
# also be run by hand for a version that already exists: "Run workflow" and type
# the version without the leading v.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to submit, without the leading v (for example 1.7.3)"
        required: true

permissions:
  contents: read

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.release.tag_name, 'android-v') && !github.event.release.prerelease)
    runs-on: windows-latest
    steps:
      - name: Work out the version and installer URL
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') { $v = $env:INPUT_VERSION } else { $v = $env:RELEASE_TAG }
          $v = $v.Trim().TrimStart('v')
          if ($v -notmatch '^\d+(\.\d+){1,3}$') { throw "Not a version number: $v" }
          $url = "https://github.com/${{ github.repository }}/releases/download/v$v/VoxScribe-Setup.exe"
          "version=$v" >> $env:GITHUB_OUTPUT
          "url=$url" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, installer $url"

      - name: Wait for the installer to be attached to the release
        shell: pwsh
        env:
          INSTALLER_URL: ${{ steps.release.outputs.url }}
        run: |
          for ($i = 1; $i -le 20; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $env:INSTALLER_URL -Method Head -MaximumRedirection 5 -UseBasicParsing
              if ($r.StatusCode -eq 200) { Write-Host "Installer found."; exit 0 }
            } catch { }
            Write-Host "Installer not there yet (attempt $i of 20), waiting 30 seconds."
            Start-Sleep -Seconds 30
          }
          throw "VoxScribe-Setup.exe was not attached to the release within 10 minutes. Attach it, then run this workflow by hand."

      - name: Submit the update to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          INSTALLER_URL: ${{ steps.release.outputs.url }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Warning "The WINGET_TOKEN secret is not set, so nothing was submitted. See the notes at the top of this file."
            exit 0
          }
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          # The setup program itself is 32-bit, so wingetcreate reads it as x86,
          # but it installs the 64-bit app and the manifest lists it as x64.
          .\wingetcreate.exe update ahmedhmam1994.VoxScribe --version $env:VERSION --urls "$($env:INSTALLER_URL)|x64" --submit --token $env:WINGET_TOKEN
